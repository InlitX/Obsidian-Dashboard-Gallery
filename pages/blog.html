<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Obsidian Dashboard Gallery</title>
    <meta name="description" content="Tutorials, guides and updates for Obsidian dashboards.">
    <meta name="robots" content="index, follow">
    
    <meta property="og:title" content="Blog - Obsidian Dashboard Gallery">
    <meta property="og:description" content="Tutorials, guides and updates for Obsidian dashboards.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://obsidian-dashboard-gallery.vercel.app/pages/blog.html">
    <meta property="og:image" content="https://raw.githubusercontent.com/InlitX/Obsidian-Dashboard-Gallery/main/assets/images/dashboards/Dashboard-Brutalist.png">
    
    <link rel="canonical" href="https://obsidian-dashboard-gallery.vercel.app/pages/blog.html">
    <link rel="icon" href="../images/logo.png" type="image/png">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/blog.css">
</head>
<body>
    <div class="bg"></div>

    <header class="header">
        <div class="header-left">
            <a href="../index.html" class="logo-link">
                <img src="../images/logo.png" alt="Logo" class="header-logo">
                <span class="logo-text">Obsidian Gallery</span>
            </a>
        </div>
        <div class="header-right">
            <a href="https://github.com/InlitX/Obsidian-Dashboard-Gallery" target="_blank" class="header-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
                </svg>
                <span data-i18n="header.repo">Repo</span>
            </a>
            <a href="https://github.com/InlitX/Obsidian-Dashboard-Gallery" target="_blank" class="header-btn star-btn-header">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="currentColor"/>
                </svg>
                <span id="stars-header">Star</span>
            </a>
            <button class="header-btn theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <svg class="sun-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
            <div class="lang-dropdown">
                <button class="lang-trigger header-btn" id="langTrigger">
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" fill="none" stroke-width="1.5"/>
                        <path d="M2 12h20M12 2c2.5 2.5 4 6 4 10s-1.5 7.5-4 10c-2.5-2.5-4-6-4-10s1.5-7.5 4-10z" stroke="currentColor" fill="none" stroke-width="1.5"/>
                    </svg>
                    <span id="currentLangLabel">EN</span>
                </button>
                <div class="lang-menu" id="langMenu">
                    <button class="lang-option" data-lang="en">English</button>
                    <button class="lang-option" data-lang="es">Espanol</button>
                    <button class="lang-option" data-lang="fr">Francais</button>
                    <button class="lang-option" data-lang="de">Deutsch</button>
                    <button class="lang-option" data-lang="it">Italiano</button>
                    <button class="lang-option" data-lang="pt">Portugues</button>
                    <button class="lang-option" data-lang="zh">Zhongwen</button>
                    <button class="lang-option" data-lang="ja">Nihongo</button>
                </div>
            </div>
        </div>
    </header>

    <main class="blog-page">
        <h1 class="blog-page-title">Blog</h1>
        <p class="blog-page-desc">Tutorials, updates and guides for Obsidian dashboards.</p>
        
        <div class="coming-soon-box" style="margin-top: 40px;">
            <span class="coming-soon-tag">En construcción</span>
            <p>El blog estará disponible pronto. ¡Mantente atento!</p>
        </div>
    </main>

    <footer>
        <p data-i18n="footer.made">Made with care for the Obsidian community</p>
        <p>&copy; 2026 <a href="https://github.com/InlitX">InlitX</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/i18next@23.7.6/i18next.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next-browser-languagedetector@7.2.0/i18nextBrowserLanguageDetector.min.js"></script>
    <script src="../assets/js/i18n-config.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        function renderBlogPosts() {
            const container = document.getElementById('blogPostsList');
            container.innerHTML = Object.entries(blogPosts).map(([id, post]) => `
                <a href="blog-post.html?p=${id}" class="blog-post-card">
                    <div class="blog-post-card-img">
                        <img src="../${post.image}" alt="">
                    </div>
                    <div class="blog-post-card-content">
                        <span class="blog-post-date">${post.date}</span>
                        <h2 class="blog-post-card-title">${post.titles[currentLang] || post.titles.en}</h2>
                        <p class="blog-post-card-excerpt">${post.excerpts[currentLang] || post.excerpts.en}</p>
                        <div class="blog-post-card-meta">
                            <span>${post.readTime} ${t('blog.readTime')}</span>
                        </div>
                    </div>
                </a>
            `).join('');
        }
        renderBlogPosts();
    </script>
</body>
</html>
